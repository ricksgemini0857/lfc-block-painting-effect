<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFC 積木畫效果</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;700&display=swap");
        
        :root {
            --bg-dark: #0a0a1a;
            --primary-glow: #00ffff;
            --secondary-glow: #9400d3;
            --text-light: #e0e0e0;
        }

        body {
            font-family: "Exo-2", "Noto Sans TC", sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        .background-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: url("https://images.pexels.com/photos/998641/pexels-photo-998641.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2");
            background-size: cover; background-position: center;
            animation: pulse-bg 20s ease-in-out infinite;
        }

        @keyframes pulse-bg {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .main-container {
            background: rgba(26, 26, 46, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.1), 0 0 50px rgba(148, 0, 211, 0.1);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tech-input {
            background: rgba(10, 10, 26, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.2);
            color: var(--text-light);
            transition: all 0.3s ease;
        }
        .tech-input:focus {
            background: rgba(10, 10, 26, 0.9);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            border-color: var(--primary-glow);
        }

        .tech-button {
            background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
            color: #ffffff; border: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), 0 0 20px rgba(148, 0, 211, 0.2);
            transition: all 0.3s ease;
        }
        .tech-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5), 0 0 35px rgba(148, 0, 211, 0.3);
        }
        
        .secondary-button {
            background-color: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--primary-glow);
            color: var(--primary-glow);
        }
        .secondary-button:hover {
            background-color: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .gallery-card {
            background: rgba(10, 10, 26, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
        }
        .gallery-card .card-loader {
            border-color: var(--primary-glow);
            border-top-color: transparent;
        }

        .loader {
            width: 48px; height: 48px; border: 3px solid var(--primary-glow);
            border-radius: 50%; display: inline-block; position: relative;
            box-sizing: border-box; animation: rotation 1s linear infinite;
        }
        .loader::after {
            content: ""; box-sizing: border-box; position: absolute;
            left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 56px; height: 56px; border-radius: 50%;
            border: 3px solid; border-color: var(--secondary-glow) transparent;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="grid place-items-center min-h-screen p-4">
    <div class="background-animation"></div>

    <div id="main-container" class="main-container w-full max-w-md rounded-2xl shadow-xl p-8 transition-all duration-500">
        <!-- 登入畫面 -->
        <div id="login-view">
            <div class="text-center">
                <img src="https://ppt.cc/f5TqJx@.png" alt="LFC Logo" class="mx-auto h-24 w-auto mb-4 drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                <h1 class="text-3xl font-bold text-white drop-shadow-[0_0_5px_var(--primary-glow)]">積木畫效果展示</h1>
                <p class="text-gray-300 mt-2">請輸入指定的姓名</p>
            </div>
            <div class="space-y-4 mt-6">
                <div>
                    <label for="name" class="text-sm font-medium text-gray-300">姓名</label>
                    <input type="text" id="name" name="name" placeholder="請輸入姓名" class="tech-input mt-1 block w-full px-4 py-3 rounded-lg shadow-sm focus:outline-none transition">
                </div>
                <button id="search-btn" class="tech-button w-full font-bold py-3 px-4 rounded-lg shadow-lg">進入效果圖頁面</button>
            </div>
            <div id="login-result" class="text-center pt-4"></div>
        </div>

        <!-- 展示畫面 (預設隱藏) -->
        <div id="gallery-view" class="hidden">
             <div class="text-center mb-8">
                <h1 id="gallery-title" class="text-3xl font-bold text-white drop-shadow-[0_0_5px_var(--primary-glow)]"></h1>
                <p class="text-gray-300 mt-2">點擊卡片可開啟完整效果圖</p>
            </div>
            <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- 作品卡片將會被動態加到這裡 -->
            </div>
            <div class="mt-8 text-center">
                <button id="back-btn" class="secondary-button font-bold py-2 px-6 rounded-lg transition">返回</button>
            </div>
        </div>
    </div>

    <script>
        // --- 設定區 ---
        // ！！！請將下方網址替換成您在步驟二複製的 "全新" 網頁應用程式網址！！！
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3UP_fUUUfDJi9cS-wdixuxiE3gY-Vf-ivAGoVt5IyaMaoc3_U64BIWHE-mjH_p8AS/exec";

        document.addEventListener("DOMContentLoaded", () => {
            const mainContainer = document.getElementById("main-container");
            const loginView = document.getElementById("login-view");
            const galleryView = document.getElementById("gallery-view");
            const nameInput = document.getElementById("name");
            const searchBtn = document.getElementById("search-btn");
            const backBtn = document.getElementById("back-btn");
            const loginResult = document.getElementById("login-result");
            const galleryGrid = document.getElementById("gallery-grid");
            const galleryTitle = document.getElementById("gallery-title");

            function getGoogleDriveFileId(url) {
                if (!url) return null;
                let match = url.match(/d\/(.*?)(?:\/view|\?|$)/);
                if (match && match[1]) return match[1];
                match = url.match(/id=([^&]+)/);
                if (match && match[1]) return match[1];
                return null;
            }
            
            async function loadThumbnails() {
                const cards = document.querySelectorAll(".gallery-card[data-fileid]");
                for (const card of cards) {
                    const fileId = card.dataset.fileid;
                    const remark = card.dataset.remark || "";
                    try {
                        const response = await fetch(`${SCRIPT_URL}?action=getThumbnail&id=${fileId}`);
                        const result = await response.json();
                        if (result.status === "success") {
                            // 主要修改點: 圖片改為完整顯示 (object-contain)
                            card.classList.remove("grid", "place-items-center", "aspect-square"); // 移除佔位樣式
                            card.innerHTML = `
                                <a href="https://drive.google.com/uc?id=${fileId}" target="_blank" class="block aspect-square bg-black/20 rounded-t-lg">
                                    <img src="${result.imageUrl}" alt="作品縮圖" class="w-full h-full object-contain">
                                </a>
                                ${remark ? `<div class="p-3 text-sm text-center text-gray-300 bg-black/20 rounded-b-lg">${remark}</div>` : ""}
                            `;
                        } else {
                            card.innerHTML = `<div class="p-4 text-center text-xs text-red-400">縮圖載入失敗</div>`;
                        }
                    } catch (error) {
                         card.innerHTML = `<div class="p-4 text-center text-xs text-red-400">縮圖載入失敗</div>`;
                    }
                }
            }

            searchBtn.addEventListener("click", async () => {
                const name = nameInput.value.trim();
                if (!name) {
                    loginResult.innerHTML = `<p class="text-red-400 font-semibold">請務必填寫姓名！</p>`;
                    return;
                }
                
                if (SCRIPT_URL === "YOUR_NEW_APPS_SCRIPT_URL") {
                    loginResult.innerHTML = `<p class="text-red-400 font-semibold">錯誤：網站尚未設定完成。</p>`;
                    return;
                }

                loginResult.innerHTML = `
                    <div class="flex justify-center items-center flex-col gap-4">
                        <div class="loader"></div>
                        <p class="text-gray-300">正在驗證身份...</p>
                    </div>`;

                try {
                    const response = await fetch(`${SCRIPT_URL}?name=${encodeURIComponent(name)}`);
                    const result = await response.json();

                    if (result.status === "success" && result.data && result.data.length > 0) {
                        galleryTitle.textContent = `${result.data[0].name} 的積木畫效果展示`;
                        galleryGrid.innerHTML = "";
                        
                        result.data.forEach(entry => {
                            const urls = entry.fileUrl.split(",");
                            const remarks = (entry.remarks || "").split(",");

                            urls.forEach((url, index) => {
                                const trimmedUrl = url.trim();
                                if (trimmedUrl) {
                                    const fileId = getGoogleDriveFileId(trimmedUrl);
                                    if (fileId) {
                                        const remark = remarks[index] ? remarks[index].trim() : "";
                                        // 建立卡片佔位符
                                        const cardElement = document.createElement("div");
                                        cardElement.className = "gallery-card block rounded-lg";
                                        cardElement.dataset.fileid = fileId;
                                        cardElement.dataset.remark = remark;
                                        cardElement.innerHTML = `<div class="aspect-square grid place-items-center"><div class="card-loader w-8 h-8 border-2 rounded-full animate-spin"></div></div>`;
                                        galleryGrid.appendChild(cardElement);
                                    }
                                }
                            });
                        });
                        
                        mainContainer.classList.remove("max-w-md");
                        mainContainer.classList.add("max-w-5xl");
                        loginView.classList.add("hidden");
                        galleryView.classList.remove("hidden");

                        loadThumbnails(); // 開始載入縮圖

                    } else {
                        loginResult.innerHTML = `<p class="text-orange-400 font-semibold">${result.message || "找不到此姓名的作品。"} (後端版本: ${result.script_version || "未知"})</p>`;
                    }
                } catch (error) {
                    console.error("查詢失敗:", error);
                    loginResult.innerHTML = `<p class="text-red-400 font-semibold">查詢失敗，請檢查網路連線。</p>`;
                }
            });
            
            backBtn.addEventListener("click", () => {
                mainContainer.classList.remove("max-w-5xl");
                mainContainer.classList.add("max-w-md");
                galleryView.classList.add("hidden");
                loginView.classList.remove("hidden");
                loginResult.innerHTML = "";
                nameInput.value = "";
            });
        });
    </script>
</body>
</html>
